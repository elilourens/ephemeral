spring:
  application:
    name: ephemeral
  web:
    resources:
      cache:
        cachecontrol:
          # no-build frontend: browsers must revalidate (cheap 304s) so UI
          # changes appear on plain refresh instead of being heuristically cached
          no-cache: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ephemeral}
    username: ${DB_USER:ephemeral}
    password: ${DB_PASSWORD:ephemeral}
    hikari:
      # ~10 users on a 1-2 vCPU box: a small pool has lower latency under
      # contention than the default 10 (HikariCP "About Pool Sizing")
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  shutdown: graceful
  # tolerate large/stale browser cookies from other apps sharing localhost
  max-http-request-header-size: 64KB
  compression:
    enabled: true                 # app.js/style.css/vendor drop ~65% on the wire
    min-response-size: 1KB
    mime-types: text/html,text/css,application/javascript,application/json,image/svg+xml
  tomcat:
    threads:
      max: 25                     # 200 default is wild overkill for a friend group

ephemeral:
  retention: ${RETENTION:7d}
  cleanup-interval: ${CLEANUP_INTERVAL:15m}
  jwt-secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}
  encryption-key: ${ENCRYPTION_KEY:}
  search-index: ${SEARCH_INDEX:true}
  jwt-ttl: 7d
  storage-dir: ${STORAGE_DIR:./data/uploads}
  tenor-key: ${TENOR_KEY:}
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:livekit-dev-secret-please-change-me-0123456789}

logging:
  level:
    com.ephemeral: ${LOG_LEVEL:INFO}   # DEBUG in dev via LOG_LEVEL=DEBUG
