<style>
  /* voice spotlight / focus */
  #voice-tiles .tile.has-video, #voice-tiles .screen-tile { cursor: pointer; }
  .screen-tile { background: #0d0c10; }
  .screen-badge { display: inline-flex; margin-right: 5px; color: var(--accent, #e2965a); vertical-align: middle; }
  #voice-tiles.focused { display: flex; flex-direction: column; gap: 10px; height: 100%; min-height: 0; }
  #voice-tiles.focused .tile { margin: 0; }
  #voice-tiles.focused .tile.stage { flex: 1 1 auto; min-height: 0; width: 100%; position: relative; aspect-ratio: auto; background: #000; display: flex; align-items: center; justify-content: center; }
  #voice-tiles.focused .tile.stage video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #voice-tiles.focused .voice-strip { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; overflow-y: hidden; padding: 2px 0 6px; }
  #voice-tiles.focused .voice-strip .tile.thumb { flex: 0 0 auto; width: 172px; height: 100px; aspect-ratio: auto; margin: 0; }
  .stage-exit { position: absolute; top: 12px; right: 12px; z-index: 6; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; border: none; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; cursor: pointer; }

<!-- =====================================================================
     ephemeral — self-hosted Discord clone with disappearing messages.
     No build step. index.html + style.css + app.js + vendored LiveKit.
     Icons are inline Lucide SVG (MIT). Fonts: Geist (UI) + Instrument Serif.
     ===================================================================== -->

<!-- ============================ LIQUID GLASS ===========================
     Backdrop mesh (what the glass refracts) + the refraction filter itself.
     #glass-refract is a size-independent displacement map: fractal noise,
     softened, then used to warp the backdrop behind any frosted control.
     Chromium renders it as backdrop-filter: url(#glass-refract); Safari and
     Firefox ignore the url() and keep the blur fallback. ================= -->
<div id="glass-bg" aria-hidden="true">
  <!-- procedural cumulus clouds drifting under the glass — like the messages, they pass -->
  <div class="bg-cloud c1"></div>
  <div class="bg-cloud c2"></div>
  <div class="bg-cloud c3"></div>
</div>
<svg id="glass-defs" width="0" height="0" aria-hidden="true" focusable="false"
     style="position:absolute;width:0;height:0;overflow:hidden;pointer-events:none">
  <filter id="glass-refract" x="-25%" y="-25%" width="150%" height="150%"
          color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.012"
                  numOctaves="2" seed="11" stitchTiles="stitch" result="noise"/>
    <feGaussianBlur in="noise" stdDeviation="1.6" result="softNoise"/>
    <feDisplacementMap in="SourceGraphic" in2="softNoise" scale="26"
                       xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<!-- ------------------------------- AUTH -------------------------------- -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <!-- pixel-art hourglass: 12×12 grid of rects, crisp edges, sand at 55% -->
      <svg class="icon auth-mark" viewBox="0 0 12 12" width="32" height="32" shape-rendering="crispEdges" fill="currentColor" aria-hidden="true">
        <rect x="0" y="0" width="12" height="1"/>
        <rect x="1" y="1" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/>
        <rect x="2" y="2" width="1" height="1"/><rect x="9" y="2" width="1" height="1"/>
        <rect x="3" y="3" width="1" height="1"/><rect x="8" y="3" width="1" height="1"/>
        <rect x="4" y="4" width="1" height="1"/><rect x="7" y="4" width="1" height="1"/>
        <rect x="5" y="5" width="2" height="1"/>
        <rect x="5" y="6" width="2" height="1"/>
        <rect x="4" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/>
        <rect x="3" y="8" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/>
        <rect x="2" y="9" width="1" height="1"/><rect x="9" y="9" width="1" height="1"/>
        <rect x="1" y="10" width="1" height="1"/><rect x="10" y="10" width="1" height="1"/>
        <rect x="0" y="11" width="12" height="1"/>
        <g opacity=".65">
          <!-- sand: equal 6-4-2 piles so the drain mirrors the fill exactly -->
          <rect class="hg-t0" x="3" y="2" width="6" height="1"/>
          <rect class="hg-t1" x="4" y="3" width="4" height="1"/>
          <rect class="hg-t2" x="5" y="4" width="2" height="1"/>
          <rect class="hg-g" x="5" y="7" width="1" height="1" opacity="0"/>
          <rect class="hg-b3" x="5" y="8" width="2" height="1"/>
          <rect class="hg-b2" x="4" y="9" width="4" height="1"/>
          <rect class="hg-b1" x="3" y="10" width="6" height="1"/>
        </g>
      </svg>
      <h1 class="brand">Ephemeral</h1>
    </div>
    <form id="auth-form" autocomplete="on">
      <label>
        Username
        <input id="auth-username" class="text-input" autocomplete="username" required minlength="3" maxlength="32" />
      </label>
      <label id="displayname-field" class="hidden">
        Display name <span style="text-transform:none;font-weight:400;color:var(--text-faint)">(optional)</span>
        <input id="auth-displayname" class="text-input" maxlength="60" />
      </label>
      <label>
        Password
        <input id="auth-password" class="text-input" type="password" autocomplete="current-password" required minlength="6" />
      </label>
      <div id="auth-error" class="auth-error"></div>
      <button type="submit" id="auth-submit" class="btn">Log in</button>
    </form>
    <p class="auth-toggle">
      <span id="auth-toggle-text">Need an account?</span>
      <a id="auth-toggle-link">Register</a>
    </p>
  </div>
</div>

<!-- LiveKit browser SDK (vendored, exposes window.LivekitClient). Loaded
     before app.js so the voice layer can feature-detect it. -->
<script src="/vendor/livekit-client.umd.min.js"></script>
<script src="/app.js"></script>
